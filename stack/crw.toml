[server]
host = "127.0.0.1"
port = 3080
request_timeout_secs = 90
rate_limit_rps = 3

[request]
deadline_ms_default = 45000
auto_extend_deadline_for_ladder = false

[renderer]
mode = "auto"
pool_size = 1
http_timeout_ms = 12000
lightpanda_timeout_ms = 15000
page_timeout_ms = 25000

[renderer.lightpanda]
ws_url = "ws://127.0.0.1:9222/"

[crawler]
max_concurrency = 2
requests_per_second = 1.0
respect_robots_txt = true

[extraction]
only_main_content = false

[search]
searxng_url = "http://127.0.0.1:8890"
timeout_ms = 20000
default_limit = 10
max_limit = 20
query_expand = false
