[project]
name = "inn-site"
version = "0.1.0"
description = "Поиск сайта российской организации по ИНН"
requires-python = ">=3.11"
dependencies = [
  "filelock>=3.19,<5",
  "ddgs>=9.16,<10",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.13,<5",
  "pydantic>=2.11,<3",
  "pypdf>=6,<7",
  "tldextract>=5.3,<6",
]

[project.scripts]
inn-site = "inn_site.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]
docs = ["reportlab>=4.4,<5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
